<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>フラッシュカード</title>
<style>
  :root {
    --bg: #eef1ee;
    --ink: #1b2521;
    --ink-soft: #46534c;
    --muted: #75817a;
    --line: #d7dbd2;
    --card-bg: #fdfcf9;
    --card-shadow: 220, 224, 216;
    --accent: #2f6e5c;
    --accent-ink: #f4faf7;
    --accent-soft: #dcebe4;
    --coral: #c24a32;
    --coral-soft: #f3d9cd;
    --coral-mark: #f6c6b3;
    --focus: #2f6e5c;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121714;
      --ink: #e9ede9;
      --ink-soft: #b7c1ba;
      --muted: #7f8b83;
      --line: #2a332c;
      --card-bg: #1b2320;
      --card-shadow: 0, 0, 0;
      --accent: #63bfa0;
      --accent-ink: #0d1613;
      --accent-soft: #223a32;
      --coral: #e2896a;
      --coral-soft: #3a2a22;
      --coral-mark: #4a3324;
      --focus: #63bfa0;
    }
  }
  :root[data-theme="dark"] {
    --bg: #121714; --ink: #e9ede9; --ink-soft: #b7c1ba; --muted: #7f8b83;
    --line: #2a332c; --card-bg: #1b2320; --card-shadow: 0, 0, 0;
    --accent: #63bfa0; --accent-ink: #0d1613; --accent-soft: #223a32;
    --coral: #e2896a; --coral-soft: #3a2a22; --coral-mark: #4a3324; --focus: #63bfa0;
  }
  :root[data-theme="light"] {
    --bg: #eef1ee; --ink: #1b2521; --ink-soft: #46534c; --muted: #75817a;
    --line: #d7dbd2; --card-bg: #fdfcf9; --card-shadow: 220, 224, 216;
    --accent: #2f6e5c; --accent-ink: #f4faf7; --accent-soft: #dcebe4;
    --coral: #c24a32; --coral-soft: #f3d9cd; --coral-mark: #f6c6b3; --focus: #2f6e5c;
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    background: var(--bg);
    background-image: radial-gradient(circle at 1px 1px, rgba(127,139,131,0.16) 1px, transparent 0);
    background-size: 22px 22px;
    color: var(--ink);
    font-family: -apple-system, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans JP", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  body { min-height: 100vh; display: flex; justify-content: center; padding: 28px 16px 48px; }
  .page { width: 100%; max-width: 460px; display: flex; flex-direction: column; gap: 16px; }

  header { display: flex; flex-direction: column; gap: 4px; padding: 2px 2px 4px; }
  .eyebrow {
    font: 600 11px/1 ui-monospace, "SF Mono", Consolas, monospace;
    letter-spacing: 0.14em; text-transform: uppercase; color: var(--accent);
  }
  h1 { margin: 0; font: 700 26px/1.15 Georgia, "Iowan Old Style", "Hiragino Mincho ProN", serif; letter-spacing: 0.01em; }
  .sub { margin: 0; font-size: 13px; color: var(--muted); }

  /* ---------- tabs (used for both deck selector and group filter) ---------- */
  .tabs { display: flex; gap: 7px; overflow-x: auto; padding-bottom: 2px; -ms-overflow-style: none; scrollbar-width: none; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    flex: 0 0 auto; display: flex; align-items: center; gap: 6px;
    padding: 7px 12px 7px 9px; border-radius: 8px; border: 1px solid var(--line);
    background: var(--card-bg); color: var(--ink-soft); font-size: 12.5px; font-weight: 600;
    cursor: pointer; white-space: nowrap; transition: background .15s, color .15s, border-color .15s;
  }
  .tab .chip { width: 8px; height: 8px; border-radius: 2px; background: var(--tab-color, var(--muted)); flex: 0 0 auto; }
  .tab[aria-selected="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .tab[aria-selected="true"] .chip { background: var(--accent-ink); }
  .tab .n { opacity: .7; font-variant-numeric: tabular-nums; }
  .deck-tabs .tab { font-size: 13.5px; padding: 9px 14px 9px 11px; }

  /* ---------- toolbar ---------- */
  .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .toggle { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink-soft); cursor: pointer; user-select: none; }
  .toggle input { accent-color: var(--accent); width: 14px; height: 14px; }
  .icon-btn {
    display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 32px;
    border-radius: 8px; border: 1px solid var(--line); background: var(--card-bg); color: var(--ink-soft);
    cursor: pointer; font-size: 15px; line-height: 1; transition: transform .15s, background .15s, color .15s;
  }
  .icon-btn:hover { color: var(--ink); }
  .icon-btn[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }
  .icon-btn:active { transform: scale(0.92); }
  .toolbar-actions { display: flex; align-items: center; gap: 8px; }

  /* ---------- stats ---------- */
  .stats { display: flex; align-items: center; gap: 12px; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .stats b { color: var(--ink); font-weight: 700; }
  .dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; margin-right: 4px; }
  .dot.again { background: var(--coral); }
  .dot.got { background: var(--accent); }
  .progress-track { flex: 1; height: 4px; border-radius: 2px; background: var(--line); overflow: hidden; }
  .progress-fill { height: 100%; background: var(--accent); border-radius: 2px; transition: width .3s ease; }

  /* ---------- deck ---------- */
  .deck-wrap { position: relative; min-height: 430px; }
  .deck-shadow { position: absolute; inset: 0; border-radius: 18px; background: var(--card-bg); border: 1px solid var(--line); }
  .deck-shadow.s2 { transform: translateY(14px) scale(0.94); opacity: .45; }
  .deck-shadow.s1 { transform: translateY(7px) scale(0.97); opacity: .7; }

  .card { position: absolute; inset: 0; border-radius: 18px; cursor: pointer; perspective: 1400px; outline: none; }
  .card:focus-visible .card-inner { box-shadow: 0 0 0 3px var(--focus); }
  .card-inner {
    position: relative; width: 100%; height: 100%; border-radius: 18px;
    transition: transform .5s cubic-bezier(.2,.8,.3,1); transform-style: preserve-3d;
  }
  .card.flipped .card-inner { transform: rotateY(180deg); }
  @media (prefers-reduced-motion: reduce) { .card-inner, .progress-fill, .icon-btn { transition: none !important; } }

  .card-face {
    position: absolute; inset: 0; border-radius: 18px; backface-visibility: hidden; -webkit-backface-visibility: hidden;
    background: var(--card-bg); border: 1px solid var(--line); box-shadow: 0 18px 34px -18px rgba(var(--card-shadow), .55);
    padding: 22px 22px 18px; display: flex; flex-direction: column; overflow-y: auto;
  }
  .card-back { transform: rotateY(180deg); }

  .face-top {
    display: flex; align-items: center; justify-content: space-between;
    font: 600 11px/1 ui-monospace, "SF Mono", Consolas, monospace; letter-spacing: .06em;
    color: var(--muted); text-transform: uppercase;
  }
  .pos-tag {
    display: inline-flex; align-items: center; justify-content: center; width: 22px; height: 22px;
    border-radius: 6px; background: var(--accent-soft); color: var(--accent);
    font-family: -apple-system, "Hiragino Sans", sans-serif; font-size: 12px; font-weight: 700;
    text-transform: none; letter-spacing: 0;
  }
  .pos-tag.wrong-tag { background: var(--coral-soft); color: var(--coral); }
  .pos-tag:empty { display: none; }

  /* front face */
  .card-front { align-items: flex-start; justify-content: center; text-align: left; gap: 14px; }
  .term {
    font: 700 44px/1.05 Georgia, "Iowan Old Style", serif; letter-spacing: -0.01em;
    word-break: break-word; text-wrap: balance;
  }
  .term.sm { font: 500 17px/1.65 Georgia, "Hiragino Mincho ProN", serif; letter-spacing: 0; white-space: pre-wrap; }
  .phon { font: 500 15px/1.4 ui-monospace, "SF Mono", Consolas, monospace; color: var(--ink-soft); }
  .phon .kana { color: var(--muted); font-family: -apple-system, "Hiragino Sans", sans-serif; margin-left: 6px; }
  .choice-list { display: flex; flex-direction: column; gap: 4px; margin-top: -4px; }
  .choice-line { font-size: 14px; line-height: 1.6; color: var(--ink-soft); }
  .choice-line b { color: var(--ink); margin-right: 4px; }
  .tap-hint { margin-top: auto; align-self: center; font-size: 11.5px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  .tap-hint svg { opacity: .6; }

  /* back face */
  .card-back { justify-content: flex-start; gap: 12px; }
  .meaning { font: 700 25px/1.3 Georgia, "Iowan Old Style", "Hiragino Mincho ProN", serif; color: var(--accent); text-wrap: balance; }
  .note { font-size: 12px; color: var(--muted); margin-top: -6px; }
  .collocation {
    display: inline-block; align-self: flex-start; padding: 4px 9px; border-radius: 999px;
    background: var(--accent-soft); color: var(--accent); font-size: 12px; font-weight: 600;
  }
  .example { border-top: 1px dashed var(--line); padding-top: 10px; display: flex; flex-direction: column; gap: 6px; }
  .ex-en { font-size: 14.5px; line-height: 1.55; color: var(--ink); }
  .ex-en mark { background: var(--coral-mark); color: var(--ink); padding: 0 2px; border-radius: 3px; }
  .ex-ja { font-size: 12.5px; line-height: 1.6; color: var(--muted); }

  /* ---------- judge row ---------- */
  .judge-row {
    display: flex; gap: 10px; opacity: 0; transform: translateY(6px); pointer-events: none;
    transition: opacity .2s ease, transform .2s ease;
  }
  .judge-row.show { opacity: 1; transform: translateY(0); pointer-events: auto; }
  .judge-btn {
    flex: 1; padding: 13px 10px; border-radius: 12px; border: 1.5px solid transparent;
    font-size: 14px; font-weight: 700; cursor: pointer; font-family: inherit; transition: transform .12s;
    display: flex; align-items: center; justify-content: center; gap: 6px;
  }
  .judge-btn:active { transform: scale(0.97); }
  .judge-btn.again { background: var(--coral-soft); color: var(--coral); border-color: var(--coral); }
  .judge-btn.got { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .judge-btn kbd { font: 600 10px/1 ui-monospace, monospace; opacity: .6; border: 1px solid currentColor; border-radius: 3px; padding: 1px 4px; }

  /* ---------- nav row ---------- */
  .nav-row { display: flex; align-items: center; justify-content: center; gap: 16px; }
  .nav-btn {
    width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line); background: var(--card-bg);
    color: var(--ink-soft); cursor: pointer; display: flex; align-items: center; justify-content: center;
    transition: opacity .15s, transform .12s;
  }
  .nav-btn:active { transform: scale(0.92); }
  .nav-btn:disabled { opacity: .35; cursor: default; }
  .nav-index { font: 600 12.5px/1 ui-monospace, monospace; color: var(--muted); min-width: 64px; text-align: center; font-variant-numeric: tabular-nums; }

  /* ---------- empty / done state ---------- */
  .done {
    position: absolute; inset: 0; border-radius: 18px; background: var(--card-bg); border: 1px solid var(--line);
    display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 14px; padding: 32px 24px;
  }
  .done[hidden] { display: none; }
  .done .big { font: 700 22px/1.3 Georgia, serif; text-wrap: balance; }
  .done .tally { display: flex; gap: 18px; font-size: 13px; color: var(--muted); }
  .done .tally b { color: var(--ink); }
  .done-actions { display: flex; gap: 10px; margin-top: 6px; }
  .pill-btn {
    padding: 10px 16px; border-radius: 10px; border: 1.5px solid var(--line); background: transparent;
    color: var(--ink-soft); font-size: 13px; font-weight: 600; cursor: pointer; font-family: inherit;
  }
  .pill-btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }

  footer { text-align: center; font-size: 11px; color: var(--muted); padding-top: 4px; }
  footer kbd { font: 600 10px/1 ui-monospace, monospace; border: 1px solid var(--line); border-radius: 3px; padding: 1px 4px; margin: 0 1px; }
</style>
</head>
<body>
<div class="page">
  <header>
    <span class="eyebrow">Flashcards</span>
    <h1>フラッシュカード</h1>
    <p class="sub" id="deckSub">読み込み中…</p>
  </header>

  <div class="tabs deck-tabs" id="deckTabs" role="tablist"></div>
  <div class="tabs" id="groupTabs" role="tablist"></div>

  <div class="toolbar">
    <label class="toggle">
      <input type="checkbox" id="hideMastered" />
      習得済みを除く
    </label>
    <div class="toolbar-actions">
      <button class="icon-btn" id="shuffleBtn" title="シャッフル" aria-pressed="false">⤨</button>
      <button class="icon-btn" id="resetBtn" title="進捗をリセット">↺</button>
    </div>
  </div>

  <div class="stats">
    <span><span class="dot got"></span><b id="gotCount">0</b> 覚えた</span>
    <span><span class="dot again"></span><b id="againCount">0</b> もう一度</span>
    <div class="progress-track"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
    <span id="remainLabel">0 / 0</span>
  </div>

  <div class="deck-wrap" id="deckWrap">
    <div class="deck-shadow s2"></div>
    <div class="deck-shadow s1"></div>
    <div class="card" id="card" tabindex="0" role="button" aria-label="カードをめくる">
      <div class="card-inner" id="cardInner">
        <div class="card-face card-front">
          <div class="face-top">
            <span id="frontLabel"></span>
            <span class="pos-tag" id="posTag"></span>
          </div>
          <div id="frontBody"></div>
          <div class="tap-hint">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 3v18M15 3v18M3 9h18M3 15h18"/></svg>
            タップして答えを見る
          </div>
        </div>
        <div class="card-face card-back">
          <div class="face-top">
            <span id="backLabel"></span>
            <span class="pos-tag" id="posTagBack"></span>
          </div>
          <div id="backBody"></div>
        </div>
      </div>
    </div>

    <div class="done" id="doneScreen" hidden>
      <div class="big" id="doneMsg">このセットは終わりです</div>
      <div class="tally">
        <span>覚えた <b id="doneGot">0</b></span>
        <span>もう一度 <b id="doneAgain">0</b></span>
      </div>
      <div class="done-actions">
        <button class="pill-btn" id="reviewAgainBtn">もう一度だけ復習</button>
        <button class="pill-btn primary" id="restartBtn">最初から</button>
      </div>
    </div>
  </div>

  <div class="judge-row" id="judgeRow">
    <button class="judge-btn again" id="againBtn">もう一度 <kbd>1</kbd></button>
    <button class="judge-btn got" id="gotBtn">覚えた <kbd>2</kbd></button>
  </div>

  <div class="nav-row">
    <button class="nav-btn" id="prevBtn" title="前へ">←</button>
    <span class="nav-index" id="navIndex">1 / 1</span>
    <button class="nav-btn" id="nextBtn" title="次へ">→</button>
  </div>

  <footer>
    <kbd>Space</kbd> めくる &nbsp; <kbd>←</kbd><kbd>→</kbd> 移動 &nbsp; <kbd>1</kbd>/<kbd>2</kbd> 判定
  </footer>
</div>

<script>
(function () {
  "use strict";

  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  function highlight(sentence, key) {
    if (!key) return sentence;
    const idx = sentence.indexOf(key);
    if (idx === -1) return sentence;
    return sentence.slice(0, idx) + "<mark>" + sentence.slice(idx, idx + key.length) + "</mark>" + sentence.slice(idx + key.length);
  }

  /* ===================== deck: 英単語 ===================== */
  const VOCAB_UNITS = [

  const VOCAB_WORDS = [
    { unit: 103, no: 1015, word: "complicated", phon: "kámplakèitid", kana: "カンプリケイティド", pos: "形",

    { unit: 104, no: 1027, word: "directly", phon: "dərèktli", kana: "ディレクトリィ", pos: "副",

        <div class="ex-en">${highlight(esc(w.exEn), w.key)}</div>
        <div class="ex-ja">${esc(w.exJa)}</div>

    const unitMeta = VOCAB_UNITS.find((u) => u.id === w.unit);
    return {
      id: `vocab-${w.no}`, groupId: w.unit, label: `UNIT ${w.unit} · ${w.no}`, tag: w.pos,

    };
  }

  function buildHistoryCard(item) {
    const LETTERS = ["ア", "イ", "ウ", "エ"];
    const frontBody = `
      <div class="term sm">${esc(item.stem)}</div>
      <div class="choice-list">
        ${item.choices.map((c, i) => `<div class="choice-line"><b>${LETTERS[i]}</b>${esc(c)}</div>`).join("")}
      </div>
    `;
    const backBody = `
      <div class="meaning">${LETTERS[item.answer]}　${esc(item.choices[item.answer])}</div>
      <div class="example"><div class="ex-en">${esc(item.explain)}</div></div>
    `;
    const groupMeta = HISTORY_GROUPS.find((g) => g.id === item.daimon);
    return {
      id: `history-${item.daimon}-${item.no}`, groupId: item.daimon, label: `大問${item.daimon} · 問${item.no}`,
      tag: item.instr === "wrong" ? "誤" : "正", tagWrong: item.instr === "wrong",
      frontBody, backBody, groupLabel: groupMeta.label, groupColor: groupMeta.color,
    };
  }

    { group: "三角関数", func: "cot x", deriv: "-1/sin²x", note: "= -csc²x = -(1+cot²x) とも書ける。" },
    { group: "三角関数", func: "sec x", deriv: "sec x・tan x", note: "" },
    { group: "三角関数", func: "csc x", deriv: "-csc x・cot x", note: "" },
    { group: "対数関数", func: "log x", deriv: "1/x", note: "log x は自然対数 logₑx（= ln x）のこと。log|x| の導関数も同じく 1/x。" },
    { group: "対数関数", func: "log_a x", deriv: "1/(x・log a)", note: "log a は a の自然対数。底の変換公式 log_a x = log x / log a から導ける。" },
    { group: "指数関数", func: "e^x", deriv: "e^x", note: "微分しても形が変わらない唯一の関数（e の定義そのもの）。" },
    { group: "指数関数", func: "a^x", deriv: "a^x・log a", note: "a^x = e^(x・log a) と変形し、合成関数の微分から導ける。" },
    { group: "逆三角関数", func: "sin⁻¹x", deriv: "1/√(1-x²)", note: "Arcsin x とも書く。定義域 -1<x<1、値域 -π/2<y<π/2。" },
    { group: "逆三角関数", func: "cos⁻¹x", deriv: "-1/√(1-x²)", note: "Arccos x とも書く。定義域 -1<x<1、値域 0<y<π。" },
    { group: "逆三角関数", func: "tan⁻¹x", deriv: "1/(1+x²)", note: "Arctan x とも書く。値域 -π/2<y<π/2。" },
    { group: "逆三角関数", func: "cot⁻¹x", deriv: "-1/(1+x²)", note: "Arccot x とも書く。値域 0<y<π。" },
    { group: "逆三角関数", func: "sec⁻¹x", deriv: "1/(|x|√(x²-1))", note: "Arcsec x とも書く。|x|≥1。" },
    { group: "逆三角関数", func: "csc⁻¹x", deriv: "-1/(|x|√(x²-1))", note: "Arccsc x とも書く。|x|≥1。" },
  ];

  function buildCalcCard(item, index) {
    const frontBody = `<div class="term">(${esc(item.func)})′</div>`;
    const backBody = `
      <div class="meaning">= ${esc(item.deriv)}</div>
      ${item.note ? `<div class="example"><div class="ex-en">${esc(item.note)}</div></div>` : ""}
    `;
    const groupMeta = CALC_GROUPS.find((g) => g.id === item.group);
    return {
      id: `calc-${index}`, groupId: item.group, label: item.group, tag: "",
      frontBody, backBody, groupLabel: groupMeta.label, groupColor: groupMeta.color,
    };
  }

  /* ===================== deck registry ===================== */
  const DECKS = [
    { id: "vocab", label: "英単語", groups: VOCAB_UNITS, cards: VOCAB_WORDS.map(buildVocabCard) },
    { id: "history", label: "世界史・日本史", groups: HISTORY_GROUPS, cards: HISTORY_ITEMS.map(buildHistoryCard) },
    { id: "calc", label: "微分公式", groups: CALC_GROUPS, cards: CALC_ITEMS.map(buildCalcCard) },
  ];

  const STORAGE_KEY = "flashcards-app-store-v1";
  const store = loadStore();
  function loadStore() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) return JSON.parse(raw);
    } catch (e) {}
    return { got: [], again: [] };
  }
  function saveStore() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(store)); } catch (e) {}
  }
  const gotSet = new Set(store.got);
  const againSet = new Set(store.again);
  function persist() {
    store.got = [...gotSet];
    store.again = [...againSet];
    saveStore();
  }

  // ---- state ----
  let activeDeckId = DECKS[0].id;
  let activeGroup = "all";
  let hideMastered = false;
  let shuffled = false;
  let order = [];
  let pos = 0;
  let flipped = false;
  let sessionGot = 0;
  let sessionAgain = 0;
  let reviewPool = null;

  const $ = (id) => document.getElementById(id);
  const deckTabsEl = $("deckTabs");
  const groupTabsEl = $("groupTabs");
  const card = $("card");
  const judgeRow = $("judgeRow");
  const doneScreen = $("doneScreen");

  function activeDeck() { return DECKS.find((d) => d.id === activeDeckId); }

  function buildDeckTabs() {
    DECKS.forEach((d) => {
      const btn = document.createElement("button");
      btn.className = "tab";
      btn.setAttribute("role", "tab");
      btn.dataset.deck = d.id;
      btn.textContent = d.label;
      btn.addEventListener("click", () => {
        activeDeckId = d.id;
        activeGroup = "all";
        reviewPool = null;
        renderDeckTabs();
        buildGroupTabs();
        rebuildOrder();
      });
      deckTabsEl.appendChild(btn);
    });
    renderDeckTabs();
  }
  function renderDeckTabs() {
    [...deckTabsEl.children].forEach((btn) => {
      btn.setAttribute("aria-selected", btn.dataset.deck === activeDeckId ? "true" : "false");
    });
  }

  function buildGroupTabs() {
    groupTabsEl.innerHTML = "";
    const deck = activeDeck();
    const all = { id: "all", label: "すべて", color: "#75817a" };
    [all, ...deck.groups].forEach((g) => {
      const btn = document.createElement("button");
      btn.className = "tab";
      btn.setAttribute("role", "tab");
      btn.style.setProperty("--tab-color", g.color);
      btn.dataset.group = g.id;
      btn.innerHTML = `<span class="chip"></span>${esc(g.label)}<span class="n"></span>`;
      btn.addEventListener("click", () => {
        activeGroup = g.id;
        reviewPool = null;
        rebuildOrder();
        renderGroupTabs();
      });
      groupTabsEl.appendChild(btn);
    });
    renderGroupTabs();
  }

  function countFor(groupId) {
    const deck = activeDeck();
    let list = groupId === "all" ? deck.cards : deck.cards.filter((c) => c.groupId === groupId);
    if (hideMastered) list = list.filter((c) => !gotSet.has(c.id));
    return list.length;
  }

  function renderGroupTabs() {
    [...groupTabsEl.children].forEach((btn) => {
      const rawId = btn.dataset.group;
      const deck = activeDeck();
      const g = deck.groups.find((x) => String(x.id) === rawId);
      const id = rawId === "all" ? "all" : (g ? g.id : rawId);
      const selected = id === activeGroup;
      btn.setAttribute("aria-selected", selected ? "true" : "false");
      btn.querySelector(".n").textContent = " (" + countFor(id) + ")";
    });
  }

  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function rebuildOrder() {
    const deck = activeDeck();
    let list;
    if (reviewPool) {
      list = reviewPool.slice();
    } else {
      list = activeGroup === "all" ? deck.cards.slice() : deck.cards.filter((c) => c.groupId === activeGroup);
      if (hideMastered) list = list.filter((c) => !gotSet.has(c.id));
    }
    if (shuffled) list = shuffle(list);
    order = list;
    pos = 0;
    flipped = false;
    sessionGot = 0;
    sessionAgain = 0;
    renderGroupTabs();
    updateSub();
    render();
  }

  function updateSub() {
    const deck = activeDeck();
    const groupLabel = activeGroup === "all" ? "すべて" : (deck.groups.find((g) => g.id === activeGroup) || {}).label;
    $("deckSub").textContent = `${deck.label} · 全${deck.cards.length}枚 · ${groupLabel}`;
  }

  function render() {
    doneScreen.hidden = order.length > 0 && pos < order.length;
    card.style.display = doneScreen.hidden ? "block" : "none";
    judgeRow.classList.toggle("show", false);

    if (order.length === 0 || pos >= order.length) {
      showDone();
      updateStats();
      return;
    }

    const c = order[pos];
    card.classList.remove("flipped");
    flipped = false;

    $("frontLabel").textContent = c.label;
    $("backLabel").textContent = c.label;
    $("posTag").textContent = c.tag || "";
    $("posTag").classList.toggle("wrong-tag", !!c.tagWrong);
    $("posTagBack").textContent = c.tag || "";
    $("posTagBack").classList.toggle("wrong-tag", !!c.tagWrong);
    $("frontBody").innerHTML = c.frontBody;
    $("backBody").innerHTML = c.backBody;

    $("navIndex").textContent = `${pos + 1} / ${order.length}`;
    $("prevBtn").disabled = pos === 0;
    $("nextBtn").disabled = pos === order.length - 1;

    updateStats();
  }

  function showDone() {
    $("doneGot").textContent = sessionGot;
    $("doneAgain").textContent = sessionAgain;
    $("doneMsg").textContent = order.length === 0 ? "このセットにはカードがありません" : "このセットは終わりです";
    $("reviewAgainBtn").hidden = sessionAgain === 0;
  }

  function updateStats() {
    const deck = activeDeck();
    const deckCardIds = new Set(deck.cards.map((c) => c.id));
    let got = 0, again = 0;
    gotSet.forEach((id) => { if (deckCardIds.has(id)) got++; });
    againSet.forEach((id) => { if (deckCardIds.has(id)) again++; });
    $("gotCount").textContent = got;
    $("againCount").textContent = again;
    const total = order.length || 1;
    const done = Math.min(pos, order.length);
    $("progressFill").style.width = Math.round((done / total) * 100) + "%";
    const remaining = Math.max(order.length - pos, 0);
    $("remainLabel").textContent = `残り ${remaining}`;
  }

  function flip() {
    if (order.length === 0 || pos >= order.length) return;
    flipped = !flipped;
    card.classList.toggle("flipped", flipped);
    judgeRow.classList.toggle("show", flipped);
  }

  function goTo(newPos) {
    if (newPos < 0 || newPos >= order.length) return;
    pos = newPos;
    render();
  }

  function judge(kind) {
    if (!flipped || pos >= order.length) return;
    const c = order[pos];
    if (kind === "got") {
      gotSet.add(c.id);
      againSet.delete(c.id);
      sessionGot++;
    } else {
      againSet.add(c.id);
      sessionAgain++;
    }
    persist();
    pos++;
    render();
  }

  // ---- events ----
  card.addEventListener("click", flip);
  card.addEventListener("keydown", (e) => {
    if (e.key === " " || e.key === "Enter") { e.preventDefault(); flip(); }
  });
  $("againBtn").addEventListener("click", () => judge("again"));
  $("gotBtn").addEventListener("click", () => judge("got"));
  $("prevBtn").addEventListener("click", () => goTo(pos - 1));
  $("nextBtn").addEventListener("click", () => goTo(pos + 1));

  $("shuffleBtn").addEventListener("click", () => {
    shuffled = !shuffled;
    $("shuffleBtn").setAttribute("aria-pressed", shuffled ? "true" : "false");
    rebuildOrder();
  });
  $("hideMastered").addEventListener("change", (e) => {
    hideMastered = e.target.checked;
    reviewPool = null;
    rebuildOrder();
  });
  $("resetBtn").addEventListener("click", () => {
    if (!confirm("覚えた／もう一度の記録をすべてリセットしますか？")) return;
    gotSet.clear();
    againSet.clear();
    persist();
    reviewPool = null;
    rebuildOrder();
  });
  $("restartBtn").addEventListener("click", () => {
    reviewPool = null;
    rebuildOrder();
  });
  $("reviewAgainBtn").addEventListener("click", () => {
    const deck = activeDeck();
    reviewPool = deck.cards.filter((c) => againSet.has(c.id) && (activeGroup === "all" || c.groupId === activeGroup));
    rebuildOrder();
  });

  document.addEventListener("keydown", (e) => {
    if (e.target && e.target.tagName === "INPUT") return;
    if (e.key === "ArrowRight") goTo(pos + 1);
    else if (e.key === "ArrowLeft") goTo(pos - 1);
    else if (e.key === "1") judge("again");
    else if (e.key === "2") judge("got");
  });

  buildDeckTabs();
  buildGroupTabs();
  rebuildOrder();
})();
</script>
</body>
</html>
